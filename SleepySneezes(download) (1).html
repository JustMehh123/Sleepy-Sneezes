        class SoundFX {
            constructor() {
                this.ctx = null;
                this.muted = false;
                this.chargeOsc = null;
                this.chargeGain = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playTone(freq, type, duration, startGain = 0.2, endGain = 0.01) {
                if (this.muted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(startGain, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(endGain, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {}
            }

            jumpSound() {
                this.playTone(350, 'sine', 0.15, 0.25, 0.01);
            }

            hitSound() {
                this.playTone(120, 'sawtooth', 0.25, 0.3, 0.01);
            }

            stompSound() {
                this.playTone(220, 'square', 0.12, 0.2, 0.01);
            }

            pillowSound() {
                if (this.muted || !this.ctx) return;
                this.playTone(523.25, 'sine', 0.1, 0.2, 0.01);
                setTimeout(() => this.playTone(659.25, 'sine', 0.15, 0.2, 0.01), 80);
            }

            startChargeSound() {
                if (this.muted || !this.ctx || this.chargeOsc) return;
                try {
                    this.chargeOsc = this.ctx.createOscillator();
                    this.chargeGain = this.ctx.createGain();
                    this.chargeOsc.type = 'triangle';
                    this.chargeOsc.frequency.setValueAtTime(150, this.ctx.currentTime);
                    this.chargeOsc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 1.2);
                    this.chargeGain.gain.setValueAtTime(0.05, this.ctx.currentTime);
                    this.chargeGain.gain.linearRampToValueAtTime(0.2, this.ctx.currentTime + 1.2);
                    this.chargeOsc.connect(this.chargeGain);
                    this.chargeGain.connect(this.ctx.destination);
                    this.chargeOsc.start();
                } catch (e) {}
            }

            stopChargeSound() {
                if (this.chargeOsc) {
                    try {
                        this.chargeOsc.stop();
                        this.chargeOsc.disconnect();
                    } catch (e) {}
                    this.chargeOsc = null;
                    this.chargeGain = null;
                }
            }

            sneezeSound(power = 1.0) {
                if (this.muted || !this.ctx) return;
                try {
                    const bufferSize = this.ctx.sampleRate * 0.3;
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    const noise = this.ctx.createBufferSource();
                    noise.buffer = buffer;

                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.value = 1000 * power;

                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(0.4 * power, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);

                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);
                    noise.start();
                } catch (e) {
                    this.playTone(400 * power, 'square', 0.25, 0.3, 0.01);
                }
            }
        }

                cheatCode += e.key.toLowerCase();
                if (cheatCode.length > 6) cheatCode = cheatCode.slice(-6);
                if (cheatCode === 'pickle' && currentGameState === STATE.PLAYING) {
                    cheatCode = '';
                    player.score += 1000;
                    levelComplete();
                    return;
                }
            }

            if (e.code === 'KeyM') {
                sound.muted = !sound.muted;
            }
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.Left = true;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.Right = true;
            if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') {
                keys.Up = true;
            }
            if (e.code === 'KeyS' || e.code === 'ArrowDown') {
                keys.Down = true;
                if (player.isGrounded && currentGameState === STATE.PLAYING) {
                    // Drop through platforms
                    player.dropTimer = 8;
                    player.isGrounded = false;
                    player.y += 2;
                } else if (!player.isGrounded && currentGameState === STATE.PLAYING && !player.isSlamming) {
                    player.isSlamming = true;
                    player.vy = 13;
                }
            }
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyE') {
                if (currentGameState === STATE.START) {
                    initLevel(0);
                } else if (currentGameState === STATE.MODAL) {
                    if (modalActionCallback) modalActionCallback();

            if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.Left = false;
            if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.Right = false;
            if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') keys.Up = false;
            if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.Down = false;
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyE') {
                if (keys.Sneeze && currentGameState === STATE.PLAYING) {
                    releaseSneezeBlast();
                }
                keys.Sneeze = false;
            }
        });

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            for(let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                const metrics = context.measureText(testLine);
                const testWidth = metrics.width;
                if (testWidth > maxWidth && n > 0) {
                    context.fillText(line, x, y);
                    line = words[n] + ' ';
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, x, y);
        }

        function spawnFloatingText(x, y, text, color = '#f1f5f9') {
            floatingTexts.push({ x, y, text, color, life: 45, maxLife: 45 });
        }

        function startChargingSneeze() {
            if (player.sneezeCooldownTimer > 0) return;

            if (player.sneezeEnergy < 25) {
                spawnFloatingText(player.x - 10, player.y - 15, 'NO ENERGY!', '#ef4444');
                sound.hitSound();
                return;
            }

            player.isCharging = true;
            player.chargeTimer = 0;
            sound.startChargeSound();
        }

        function releaseSneezeBlast() {
            if (!player.isCharging) return;

            player.isCharging = false;
            sound.stopChargeSound();

            const chargeRatio = Math.min(1.0, player.chargeTimer / player.maxChargeTimer);
            const energyCost = 25 + chargeRatio * 40;

            player.sneezeEnergy = Math.max(0, player.sneezeEnergy - energyCost);
            player.sneezeCooldownTimer = player.maxSneezeCooldown;

            const recoilMult = 1.0 + chargeRatio * 1.8;
            player.vx = -player.facing * player.recoilBase * recoilMult;
            player.vy = -player.recoilBase * (0.8 + chargeRatio * 1.0);
            player.isGrounded = false;
            player.isSlamming = false;

            player.scaleX = 1.6;
            player.scaleY = 0.6;

            sound.sneezeSound(0.8 + chargeRatio * 1.2);
            screenShake.trigger(4 + chargeRatio * 12);

            const blastName = chargeRatio > 0.8 ? 'MEGA SNEEZE!' : chargeRatio > 0.4 ? 'POWER SNEEZE!' : 'SNEEZE BLAST!';
            spawnFloatingText(player.x - 15, player.y - 25, blastName, chargeRatio > 0.8 ? '#f43f5e' : '#f59e0b');
            spawnFeatherBurst(player.x + player.w / 2, player.y + player.h / 2, Math.floor(10 + chargeRatio * 18));

            shockwaves.push({
                x: player.x + (player.facing > 0 ? player.w : 0),
                y: player.y + player.h / 2,
                radius: 10,
                maxRadius: 40 + chargeRatio * 80,
                alpha: 1.0,
                color: chargeRatio > 0.8 ? '#f43f5e' : '#38bdf8'
            });

            const particleCount = Math.floor(16 + chargeRatio * 35);
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: player.x + (player.facing > 0 ? player.w : 0),
                    y: player.y + player.h / 2 + (Math.random() - 0.5) * 16,
                    vx: (player.facing * (Math.random() * 8 + 3)) * (0.8 + chargeRatio * 1.2),
                    vy: (Math.random() - 0.5) * (6 + chargeRatio * 6),
                    size: Math.random() * 10 + 5 + chargeRatio * 6,
                    life: 30 + chargeRatio * 20,
                    maxLife: 30 + chargeRatio * 20,
                    color: i % 2 === 0 ? '#fda4af' : '#e0f2fe'
                });
            }

            const blastRadius = 80 + chargeRatio * 100;

            alarmClocks.forEach(clock => {
                if (!clock.rung) {
                    const dist = Math.hypot((player.x + player.w/2) - clock.x, (player.y + player.h/2) - clock.y);
                    if (dist < blastRadius) {
                        clock.rung = true;
                        sound.pillowSound();
                        const dmg = Math.floor(30 + chargeRatio * 45);
                        spawnFloatingText(clock.x, clock.y - 20, `ALARM RUNG! -${dmg} HP`, '#fbbf24');
                        spawnFeatherBurst(clock.x, clock.y, 8);
                        if (boss) {
                            boss.hp -= dmg;
                            if (boss.hp <= 0) {
                                boss.hp = 0;
                                levelComplete();
                            }
                        }
                    }
                }
            });

            enemies.forEach(e => {
                if (e.alive) {
                    const dist = Math.hypot((player.x + player.w/2) - e.x, (player.y + player.h/2) - e.y);
                    if (dist < blastRadius) {
                        e.alive = false;
                        player.score += 200;
                        sound.stompSound();
                        spawnFloatingText(e.x, e.y - 15, '+200 BLAST!', '#38bdf8');
                        spawnFeatherBurst(e.x + 12, e.y + 11, 10);
                    }
                }
            });
            player.chargeTimer = 0;
        }

        function takeDamage(amount) {
            if (player.invincibleTimer > 0) return;

            player.health -= amount;
            player.invincibleTimer = 60;
            sound.hitSound();
            screenShake.trigger(8);

            player.isCharging = false;
            sound.stopChargeSound();

            spawnFloatingText(player.x, player.y - 15, '-1 HP', '#f43f5e');

            if (player.health <= 0) {
                gameOver();
            }
        }

        function initLevel(index) {
            currentLevelIndex = index;
            const lvl = levels[currentLevelIndex];

            player.x = 50;
            player.y = 300;
            player.vx = 0;
            player.vy = 0;
            player.health = player.maxHealth;
            player.sneezeEnergy = player.maxSneezeEnergy;
            player.sneezeCooldownTimer = 0;
            player.isCharging = false;
            player.chargeTimer = 0;
            player.pillowsCollected = 0;
            hazards = [];
            bossProjectiles = [];

            lvl.setup();
            currentGameState = STATE.PLAYING;
        }

        function levelComplete() {
            player.score += 500;

            if (currentLevelIndex + 1 < levels.length) {
                currentGameState = STATE.MODAL;
                modalData.title = 'Chapter Complete!';
                modalData.story = levels[currentLevelIndex].story;
                modalActionCallback = () => {
                    initLevel(currentLevelIndex + 1);
                };
            } else {
                // Trigger victory cutscene!
                currentGameState = STATE.VICTORY;
                victoryTimer = 0;
                victoryPhase = 0;
                victoryPlayerX = player.x;
                victoryCloud = { x: CANVAS_WIDTH / 2, y: 120, r: 70, spin: 0, scaleX: 1, scaleY: 1, alpha: 1 };
                victoryStar = { x: CANVAS_WIDTH / 2, y: 120, r: 0, alpha: 0, spin: 0 };
                victoryShockwaves = [];
            }
        }

        function gameOver() {
            currentGameState = STATE.MODAL;
            modalData.title = 'Game Over';
            modalData.story = 'Sleepyhead fell into a deep allergy nap! Try charging up your Sneezes!';
            modalActionCallback = () => {
                initLevel(currentLevelIndex);
            };
        }

        function update() {
            gameTime++;

            // Victory animation update
            if (currentGameState === STATE.VICTORY) {
                victoryTimer++;
                screenShake.update();

                if (victoryPhase === 0) {
                    // Phase 0: player walks to center and charges sneeze
                    if (victoryPlayerX < CANVAS_WIDTH / 2 - 80) victoryPlayerX += 3;
                    if (victoryTimer > 90) {
                        victoryPhase = 1;
                        victoryTimer = 0;
                        // Impact shockwave
                        victoryShockwaves.push({ x: CANVAS_WIDTH/2, y: 120, radius: 10, maxRadius: 300, alpha: 1.0, color: '#38bdf8' });
                        victoryShockwaves.push({ x: CANVAS_WIDTH/2, y: 120, radius: 10, maxRadius: 220, alpha: 1.0, color: '#ffffff' });
                        screenShake.trigger(20);
                    }
                } else if (victoryPhase === 1) {
                    // Phase 1: impact frames - cloud squishes outward
                    victoryCloud.scaleX = 1 + Math.sin(victoryTimer * 0.3) * 2;
                    victoryCloud.scaleY = 0.4 + Math.abs(Math.cos(victoryTimer * 0.2)) * 0.8;
                    victoryShockwaves.forEach(sw => { sw.radius += 8; sw.alpha -= 0.03; });
                    victoryShockwaves = victoryShockwaves.filter(sw => sw.alpha > 0);
                    if (victoryTimer > 40) { victoryPhase = 2; victoryTimer = 0; }
                } else if (victoryPhase === 2) {
                    // Phase 2: cloud spirals away
                    victoryCloud.spin += 0.15;
                    victoryCloud.scaleX = 1 + Math.sin(victoryTimer * 0.2) * 0.3;
                    victoryCloud.scaleY = 1 + Math.cos(victoryTimer * 0.2) * 0.3;
                    victoryCloud.alpha = Math.max(0, 1 - victoryTimer / 80);
                    victoryCloud.x += Math.cos(victoryCloud.spin) * 4;
                    victoryCloud.y -= 1.5;
                    if (victoryTimer > 80) { victoryPhase = 3; victoryTimer = 0; victoryStar.x = victoryCloud.x; victoryStar.y = victoryCloud.y; }
                } else if (victoryPhase === 3) {
                    // Phase 3: star forms
                    victoryStar.r = Math.min(30, victoryStar.r + 1);
                    victoryStar.alpha = Math.min(1, victoryTimer / 30);
                    victoryStar.spin += 0.05;
                    if (victoryTimer > 60) { victoryPhase = 4; victoryTimer = 0; }
                } else if (victoryPhase === 4) {
                    // Phase 4: THE END screen - wait for input
                }
                return;
            }

            if (currentGameState !== STATE.PLAYING) return;
            screenShake.update();

            if (player.invincibleTimer > 0) player.invincibleTimer--;
            if (player.sneezeCooldownTimer > 0) player.sneezeCooldownTimer--;

            if (player.isCharging) {
                player.chargeTimer = Math.min(player.maxChargeTimer, player.chargeTimer + 1);
                if (gameTime % 2 === 0) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 30 + Math.random() * 20;
                    particles.push({
                        x: (player.x + player.w/2) + Math.cos(angle) * dist,
                        y: (player.y + player.h/2) + Math.sin(angle) * dist,
                        vx: -Math.cos(angle) * 3,
                        vy: -Math.sin(angle) * 3,
                        size: Math.random() * 4 + 2,
                        life: 15,
                        maxLife: 15,
                        color: '#f59e0b'
                    });
                }
                if (player.chargeTimer > player.maxChargeTimer * 0.7) {
                    screenShake.trigger(1.5);
                }
            }

            if (player.sneezeEnergy < player.maxSneezeEnergy && !player.isCharging) {
                player.sneezeEnergy = Math.min(player.maxSneezeEnergy, player.sneezeEnergy + 0.35);
            }

            player.scaleX += (1 - player.scaleX) * 0.15;
            player.scaleY += (1 - player.scaleY) * 0.15;

            if (Math.abs(player.vx) < 0.2 && player.isGrounded && gameTime % 40 === 0) {
                zzzParticles.push({
                    x: player.x + player.w / 2 + (player.facing > 0 ? 8 : -8),
                    y: player.y - 5,
                    vx: 0.3 * player.facing,
                    vy: -0.6,
                    life: 60,
                    scale: 1
                });
            }

            let accel = 0;
            if (keys.Left) {
                accel = -player.speed;
                player.facing = -1;
            } else if (keys.Right) {
                accel = player.speed;
                player.facing = 1;
            }

            const chargeSpeedMult = player.isCharging ? 0.5 : 1.0;
            player.vx += (accel * chargeSpeedMult - player.vx) * 0.22;
            player.x += player.vx;

            if (player.x < 0) player.x = 0;
            if (player.x + player.w > CANVAS_WIDTH) player.x = CANVAS_WIDTH - player.w;

            if (player.isGrounded) {
                player.coyoteTimer = 6;
                player.isGliding = false;
                player.isSlamming = false;
            } else {
                if (player.coyoteTimer > 0) player.coyoteTimer--;
            }

            if (keys.Up) {
                if (player.coyoteTimer > 0) {
                    player.vy = -7.8;
                    player.isGrounded = false;
                    player.coyoteTimer = 0;
                    player.scaleX = 0.7;
                    player.scaleY = 1.3;
                    sound.jumpSound();
                } else if (player.vy > 0) {
                    player.isGliding = true;
                    player.vy = Math.min(player.vy, 1.2);
                }
            } else {
                player.isGliding = false;
            }

            if (!player.isGrounded) {
                player.vy += player.gravity;
            }

            const prevY = player.y;
            player.y += player.vy;

            if (player.y > CANVAS_HEIGHT + 50) {
                takeDamage(1);
                player.x = 50;
                player.y = 200;
                player.vy = 0;
            }

            player.isGrounded = false;
            if (player.dropTimer > 0) player.dropTimer--;

            const wasSlammingBeforeLand = player.isSlamming;
            platforms.forEach(p => {
                if (p.type === 'moving') {
                    p.x += p.vx;
                    if (p.x <= p.minX || p.x + p.w >= p.maxX) {
                        p.vx = -p.vx;
                    }
                }
                // Skip collision if player is dropping through
                if (player.dropTimer > 0) return;
                if (player.x + player.w > p.x && player.x < p.x + p.w) {
                    if (prevY + player.h <= p.y + 10 && player.y + player.h >= p.y && player.vy >= 0) {
                        player.y = p.y - player.h;
                        player.vy = 0;
                        player.isGrounded = true;
                        if (p.type === 'moving') {
                            player.x += p.vx;
                        }
                    }
                }
            });

            // Ground pound impact effect
            if (wasSlammingBeforeLand && player.isGrounded) {
                player.isSlamming = false;
                screenShake.trigger(10);
                shockwaves.push({
                    x: player.x + player.w / 2,
                    y: player.y + player.h,
                    radius: 8,
                    maxRadius: 120,
                    alpha: 1.0,
                    color: '#38bdf8'
                });
                shockwaves.push({
                    x: player.x + player.w / 2,
                    y: player.y + player.h,
                    radius: 4,
                    maxRadius: 80,
                    alpha: 0.8,
                    color: '#ffffff'
                });
                for (let i = 0; i < 18; i++) {
                    const angle = Math.PI + (Math.random() - 0.5) * Math.PI;
                    const speed = Math.random() * 5 + 2;
                    particles.push({
                        x: player.x + player.w / 2 + (Math.random() - 0.5) * 10,
                        y: player.y + player.h,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed - 1,
                        size: Math.random() * 8 + 4,
                        life: 25,
                        maxLife: 25,
                        color: i % 3 === 0 ? '#fef08a' : i % 3 === 1 ? '#38bdf8' : '#c084fc'
                    });
                }
                spawnFloatingText(player.x + player.w/2 - 30, player.y - 10, 'GROUND POUND!', '#fde047');
                sound.hitSound();
            }

            if (boss) {
                const speedMult = boss.hp < boss.maxHp * 0.5 ? 1.5 : 1.0;
                boss.x += boss.vx * speedMult;
                if (boss.x <= 200 || boss.x + boss.w >= 600) {
                    boss.vx = -boss.vx;
                }
            }

            stardustParticles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha += Math.sin(gameTime * p.pulseSpeed) * 0.02;
                if (p.x > CANVAS_WIDTH + 10) p.x = -10;
                if (p.y < -10) p.y = CANVAS_HEIGHT + 10;
                if (p.y > CANVAS_HEIGHT + 10) p.y = -10;
            });

            featherParticles.forEach(f => {
                f.x += f.vx;
                f.y += f.vy;
                f.vy += 0.08;
                f.vx *= 0.96;
                f.rotation += f.vRot;
                f.life--;
            });
            featherParticles = featherParticles.filter(f => f.life > 0);

            pillows.forEach(pillow => {
                if (!pillow.collected) {
                    if (player.x + player.w > pillow.x && player.x < pillow.x + 22 &&
                        player.y + player.h > pillow.y && player.y < pillow.y + 22) {
                        pillow.collected = true;
                        player.pillowsCollected++;
                        player.score += 250;
                        sound.pillowSound();
                        spawnFloatingText(pillow.x, pillow.y - 10, '+250 PILLOW!', '#38bdf8');
                        spawnFeatherBurst(pillow.x + 12, pillow.y + 9, 14);

                        const lvl = levels[currentLevelIndex];
                        if (player.pillowsCollected >= lvl.pillowsTotal) {
                            if (goalPost) goalPost.unlocked = true;
                        }
                    }
                }
            });

            enemies.forEach(e => {
                if (!e.alive) return;
                e.x += e.vx;
                if (e.x <= e.minX || e.x + e.w >= e.maxX) {
                    e.vx = -e.vx;
                }
                if (e.type === 'bat') {
                    e.y = e.baseY + Math.sin(gameTime * 0.08 + e.x * 0.05) * 18;
                }
                if (player.x + player.w > e.x && player.x < e.x + e.w &&
                    player.y + player.h > e.y && player.y < e.y + e.h) {
                    if (e.type !== 'bat' && prevY + player.h <= e.y + 8 && player.vy > 0) {
                        e.alive = false;
                        player.vy = -6.0;
                        player.scaleX = 1.2;
                        player.scaleY = 0.8;
                        player.score += 150;
                        sound.stompSound();
                        spawnFloatingText(e.x, e.y - 10, '+150 STOMP!', '#38bdf8');
                    } else {
                        takeDamage(1);
                    }
                }
            });

            hazards.forEach(hz => {
                if (player.x + player.w > hz.x && player.x < hz.x + hz.w &&
                    player.y + player.h > hz.y && player.y < hz.y + hz.h) {
                    takeDamage(1);
                    if (player.invincibleTimer >= 55) {
                        player.vy = -6.5;
                    }
                }
            });

            if (boss) {
                const phase2 = boss.hp < boss.maxHp * 0.5;
                boss.attackTimer--;
                if (boss.attackTimer <= 0) {
                    const bx = boss.x + Math.sin(gameTime * 0.05) * 22 + boss.w / 2;
                    const by = boss.y + boss.h / 2;
                    const dx = (player.x + player.w / 2) - bx;
                    const dy = (player.y + player.h / 2) - by;
                    const dist = Math.max(1, Math.hypot(dx, dy));
                    const speed = phase2 ? 4.4 : 3.4;
                    bossProjectiles.push({
                        x: bx, y: by,
                        vx: (dx / dist) * speed,
                        vy: (dy / dist) * speed,
                        r: 9
                    });
                    sound.hitSound();
                    boss.attackTimer = phase2 ? 55 : 85;
                }
            }

            bossProjectiles.forEach(bp => {
                bp.x += bp.vx;
                bp.y += bp.vy;
                if (player.x + player.w > bp.x - bp.r && player.x < bp.x + bp.r &&
                    player.y + player.h > bp.y - bp.r && player.y < bp.y + bp.r) {
                    takeDamage(1);
                    bp.dead = true;
                }
            });
            bossProjectiles = bossProjectiles.filter(bp => !bp.dead && bp.x > -30 && bp.x < CANVAS_WIDTH + 30 && bp.y > -30 && bp.y < CANVAS_HEIGHT + 30);

            if (goalPost && goalPost.unlocked) {
                if (player.x + player.w > goalPost.x && player.x < goalPost.x + goalPost.w &&
                    player.y + player.h > goalPost.y && player.y < goalPost.y + goalPost.h) {
                    levelComplete();
                }
            }

            shockwaves.forEach(sw => {
                sw.radius += 4;
                sw.alpha -= 0.04;
            });
            shockwaves = shockwaves.filter(sw => sw.alpha > 0);

            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
            });
            particles = particles.filter(p => p.life > 0);

            zzzParticles.forEach(z => {
                z.x += z.vx;
                z.y += z.vy;
                z.life--;
            });
            zzzParticles = zzzParticles.filter(z => z.life > 0);

            floatingTexts.forEach(ft => {
                ft.y -= 0.7;
                ft.life--;
            });
            floatingTexts = floatingTexts.filter(ft => ft.life > 0);
        }

        function render() {
            ctx.save();
            ctx.scale(0.5, 0.5);
            ctx.translate(Math.round(screenShake.x), Math.round(screenShake.y));

            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            if (currentGameState === STATE.START) {
                ctx.fillStyle = '#030611';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                ctx.fillStyle = '#38bdf8';
                ctx.font = 'bold 64px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('SleepySneezes', CANVAS_WIDTH/2, CANVAS_HEIGHT/2 - 40);
                
                ctx.fillStyle = '#f1f5f9';
                ctx.font = '24px monospace';
                ctx.fillText('WASD/Arrows: Move & Jump', CANVAS_WIDTH/2, CANVAS_HEIGHT/2 + 20);
                ctx.fillText('SNEEZE (Shift/E): Charge & Blast!', CANVAS_WIDTH/2, CANVAS_HEIGHT/2 + 60);
                
                if (Math.floor(gameTime / 30) % 2 === 0) {
                    ctx.fillStyle = '#f43f5e';
                    ctx.font = 'bold 32px monospace';
                    ctx.fillText('PRESS SNEEZE TO START', CANVAS_WIDTH/2, CANVAS_HEIGHT/2 + 130);
                }
                ctx.restore();
                return;
            }
            if (currentGameState === STATE.VICTORY) {
                // Dark sky backdrop
                ctx.fillStyle = '#030611';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                // Twinkling stars
                ctx.fillStyle = '#ffffff';
                for (let i = 0; i < 60; i++) {
                    const sx = (i * 53 + gameTime * 0.05) % CANVAS_WIDTH;
                    const sy = (i * 29) % (CANVAS_HEIGHT - 60);
                    if (Math.abs(Math.sin(gameTime * 0.05 + i)) > 0.5) {
                        ctx.fillRect(Math.round(sx), Math.round(sy), 2, 2);
                    }
                }

                ctx.save();
                ctx.translate(Math.round(screenShake.x), Math.round(screenShake.y));

                // Shockwaves
                victoryShockwaves.forEach(sw => {
                    ctx.globalAlpha = sw.alpha;
                    ctx.fillStyle = sw.color;
                    const r = Math.round(sw.radius);
                    ctx.fillRect(Math.round(sw.x) - r, Math.round(sw.y) - r, r*2, r*2);
                    ctx.clearRect(Math.round(sw.x) - r + 4, Math.round(sw.y) - r + 4, r*2 - 8, r*2 - 8);
                    ctx.globalAlpha = 1.0;
                });

                // Draw player in victory pose
                const vpx = Math.round(victoryPlayerX);
                const vpy = 290;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(vpx - 6, vpy, 12, 12); // head
                ctx.fillRect(vpx - 3, vpy + 26, 3, 8); // leg1
                ctx.fillRect(vpx + 1, vpy + 26, 3, 8); // leg2
                // Charge aura if phase 0 charging
                if (victoryPhase === 0 && victoryTimer > 40) {
                    const auraSize = (24 + Math.sin(gameTime * 0.35) * 6) * 2;
                    const aColor = victoryTimer > 70 ? '#f43f5e' : '#38bdf8';
                    ctx.fillStyle = aColor;
                    ctx.globalAlpha = 0.7;
                    ctx.fillRect(vpx - auraSize/2, vpy + 10 - auraSize/2, auraSize, auraSize);
                    ctx.clearRect(vpx - auraSize/2 + 4, vpy + 10 - auraSize/2 + 4, auraSize - 8, auraSize - 8);
                    ctx.globalAlpha = 1.0;
                }
                // Robe
                ctx.fillStyle = '#0d9488';
                ctx.fillRect(vpx - 8, vpy + 12, 16, 6);
                ctx.fillStyle = '#06b6d4';
                ctx.fillRect(vpx - 10, vpy + 18, 20, 8);
                ctx.fillStyle = '#38bdf8';
                ctx.fillRect(vpx - 12, vpy + 26, 24, 8);
                // Stars
                ctx.fillStyle = '#fde047';
                ctx.fillRect(vpx - 6, vpy + 14, 4, 4);
                ctx.fillRect(vpx + 4, vpy + 22, 4, 4);
                // Eyes (sneezing in phase 0 later / normal otherwise)
                ctx.fillStyle = '#000000';
                if (victoryPhase === 0 && victoryTimer > 60) {
                    ctx.fillRect(vpx - 1, vpy + 4, 2, 2); // squinted
                    ctx.fillRect(vpx + 3, vpy + 4, 2, 2);
                    ctx.fillStyle = '#ef4444';
                    ctx.fillRect(vpx - 2, vpy + 2, 4, 2);
                    ctx.fillRect(vpx + 2, vpy + 2, 4, 2);
                } else {
                    ctx.fillRect(vpx - 1, vpy + 4, 2, 4);
                    ctx.fillRect(vpx + 3, vpy + 4, 2, 4);
                }
                // Arms raised in victory for phase 4
                ctx.fillStyle = '#ffffff';
                if (victoryPhase >= 3) {
                    ctx.fillRect(vpx - 14, vpy + 10, 6, 4);
                    ctx.fillRect(vpx + 8, vpy + 10, 6, 4);
                } else {
                    ctx.fillRect(vpx - 8, vpy + 18, 6, 4);
                    ctx.fillRect(vpx + 2, vpy + 18, 6, 4);
                }
                // Cap
                ctx.fillStyle = '#0d9488';
                ctx.fillRect(vpx - 6, vpy - 4, 12, 6);
                ctx.fillRect(vpx - 14, vpy - 10, 8, 6);
                ctx.fillStyle = '#fef08a';
                ctx.fillRect(vpx - 18, vpy - 14, 8, 8);

                // Draw nightmare cloud (phases 0-2)
                if (victoryPhase <= 2) {
                    ctx.globalAlpha = victoryCloud.alpha;
                    ctx.save();
                    ctx.translate(Math.round(victoryCloud.x), Math.round(victoryCloud.y));
                    ctx.scale(victoryCloud.scaleX, victoryCloud.scaleY);
                    if (victoryPhase === 2) {
                        ctx.rotate(victoryCloud.spin);
                    }
                    const cr = victoryCloud.r;
                    // Cloud body
                    ctx.fillStyle = '#2e1065';
                    ctx.fillRect(-cr, -20, cr * 2, 40);
                    ctx.fillRect(-cr * 0.6, -cr * 0.5, cr * 1.2, cr * 0.5);
                    ctx.fillRect(-cr * 0.8, -40, cr * 0.6, 25);
                    ctx.fillRect(cr * 0.2, -35, cr * 0.6, 20);
                    // Dark swirls
                    ctx.fillStyle = '#4c1d95';
                    ctx.fillRect(-cr * 0.4, -10, cr * 0.8, 20);
                    // Nightmare eyes
                    ctx.fillStyle = '#f43f5e';
                    ctx.fillRect(-20, -6, 12, 8);
                    ctx.fillRect(8, -6, 12, 8);
                    ctx.fillStyle = '#fef08a';
                    ctx.fillRect(-16, -4, 4, 4);
                    ctx.fillRect(12, -4, 4, 4);
                    ctx.restore();
                    ctx.globalAlpha = 1.0;
                }

                // Draw star (phases 3+)
                if (victoryPhase >= 3) {
                    ctx.globalAlpha = victoryStar.alpha;
                    ctx.save();
                    ctx.translate(Math.round(victoryStar.x), Math.round(victoryStar.y));
                    ctx.rotate(victoryStar.spin);
                    const sr = victoryStar.r;
                    // Star: 5-point using fillRect approximation
                    ctx.fillStyle = '#fef08a';
                    ctx.fillRect(-4, -sr, 8, sr * 2);
                    ctx.fillRect(-sr, -4, sr * 2, 8);
                    ctx.fillRect(-sr * 0.7, -sr * 0.7, sr * 0.6, sr * 0.6);
                    ctx.fillRect(sr * 0.1, -sr * 0.7, sr * 0.6, sr * 0.6);
                    ctx.fillRect(-sr * 0.7, sr * 0.1, sr * 0.6, sr * 0.6);
                    ctx.fillRect(sr * 0.1, sr * 0.1, sr * 0.6, sr * 0.6);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(-3, -sr + 4, 6, sr * 2 - 8);
                    ctx.restore();
                    ctx.globalAlpha = 1.0;
                }

                ctx.restore(); // end shake translate

                // THE END screen
                if (victoryPhase === 4) {
                    // Dark overlay
                    ctx.fillStyle = 'rgba(2,5,16,0.65)';
                    ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                    ctx.textAlign = 'center';
                    // Impact-style THE END text with outline
                    ctx.fillStyle = '#fef08a';
                    ctx.font = 'bold 88px monospace';
                    ctx.fillText('THE END', CANVAS_WIDTH/2 + 2, CANVAS_HEIGHT/2 - 60 + 2);
                    ctx.fillStyle = '#38bdf8';
                    ctx.fillText('THE END', CANVAS_WIDTH/2, CANVAS_HEIGHT/2 - 60);

                    ctx.fillStyle = '#f1f5f9';
                    ctx.font = '24px monospace';
                    ctx.fillText(`Sleep restored! Final Score: ${player.score}`, CANVAS_WIDTH/2, CANVAS_HEIGHT/2 + 10);
                    ctx.fillText('Nightmare King banished to a distant star!', CANVAS_WIDTH/2, CANVAS_HEIGHT/2 + 46);

                    if (Math.floor(gameTime / 30) % 2 === 0) {
                        ctx.fillStyle = '#f43f5e';
                        ctx.font = 'bold 28px monospace';
                        ctx.fillText('PRESS SNEEZE TO PLAY AGAIN', CANVAS_WIDTH/2, CANVAS_HEIGHT/2 + 110);
                    }
                }

                ctx.restore();
                return;
            }


            const theme = (levels[currentLevelIndex] && levels[currentLevelIndex].theme) || DEFAULT_THEME;

            ctx.fillStyle = theme.sky[0];
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            if(theme.sky[1]) {
                ctx.fillStyle = theme.sky[1];
                ctx.fillRect(0, CANVAS_HEIGHT * 0.4, CANVAS_WIDTH, CANVAS_HEIGHT * 0.6);
            }
            if(theme.sky[2]) {
                ctx.fillStyle = theme.sky[2];
                ctx.fillRect(0, CANVAS_HEIGHT * 0.7, CANVAS_WIDTH, CANVAS_HEIGHT * 0.3);
            }
            if(theme.sky[3]) {
                ctx.fillStyle = theme.sky[3];
                ctx.fillRect(0, CANVAS_HEIGHT * 0.9, CANVAS_WIDTH, CANVAS_HEIGHT * 0.1);
            }

            ctx.fillStyle = theme.moon;
            const mx = 700, my = 80, mr = 34;
            ctx.fillRect(mx - mr, my - mr/2, mr*2, mr);
            ctx.fillRect(mx - mr/2, my - mr, mr, mr*2);
            ctx.fillRect(mx - mr*0.8, my - mr*0.8, mr*1.6, mr*1.6);
            
            ctx.fillStyle = theme.sky[0];
            ctx.fillRect(mx - mr + 10, my - mr/2 - 10, mr*1.5, mr*1.5);

            ctx.fillStyle = '#0f0c23';
            ctx.beginPath();
            ctx.moveTo(0, CANVAS_HEIGHT);
            for (let rx = 0; rx <= CANVAS_WIDTH; rx += 40) {
                const ry = CANVAS_HEIGHT - 60 - Math.sin(rx * 0.012 + currentLevelIndex) * 22 - Math.cos(rx * 0.004) * 14;
                ctx.lineTo(rx, Math.round(ry));
            }
            ctx.lineTo(CANVAS_WIDTH, CANVAS_HEIGHT);
            ctx.fill();

            stardustParticles.forEach(p => {
                ctx.fillStyle = `rgba(224, 242, 254, ${Math.max(0.1, Math.min(1, p.alpha))})`;
                ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2);
            });

            const starCount = theme.starDensity || 40;
            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < starCount; i++) {
                const sx = (i * 47 + gameTime * 0.05) % CANVAS_WIDTH;
                const sy = (i * 23) % (CANVAS_HEIGHT - 60);
                if (Math.abs(Math.sin(gameTime * 0.05 + i)) > 0.5) {
                    ctx.fillRect(Math.round(sx), Math.round(sy), 2, 2);
                }
            }

            platforms.forEach(p => {
                ctx.fillStyle = '#020617';
                ctx.fillRect(Math.round(p.x), Math.round(p.y + 6), Math.round(p.w), Math.round(p.h));
                ctx.fillStyle = p.type === 'moving' ? '#1d4ed8' : '#1e293b';
                ctx.fillRect(Math.round(p.x), Math.round(p.y), Math.round(p.w), Math.round(p.h));
                ctx.fillStyle = p.type === 'moving' ? '#93c5fd' : '#64748b';
                ctx.fillRect(Math.round(p.x), Math.round(p.y), Math.round(p.w), 4);
            });

            featherParticles.forEach(f => {
                ctx.fillStyle = f.color;
                ctx.globalAlpha = Math.max(0, f.life / f.maxLife);
                ctx.fillRect(Math.round(f.x - 4), Math.round(f.y - 8), 8, 16);
                ctx.globalAlpha = 1.0;
            });

            pillows.forEach(pillow => {
                if (!pillow.collected) {
                    const bobY = Math.round(pillow.y + Math.sin(gameTime * 0.09) * 5);
                    ctx.fillStyle = '#0284c7';
                    ctx.fillRect(Math.round(pillow.x), bobY, 24, 18);
                    ctx.fillStyle = '#7dd3fc';
                    ctx.fillRect(Math.round(pillow.x), bobY, 24, 4);
                    ctx.fillStyle = '#fef08a';
                    ctx.fillRect(Math.round(pillow.x + 10), bobY + 7, 4, 4);
                }
            });

            alarmClocks.forEach(clock => {
                const ringOffset = !clock.rung ? Math.round(Math.sin(gameTime * 0.3) * 2.5) : 0;
                const cx = Math.round(clock.x + ringOffset);
                const cy = Math.round(clock.y);
                
                ctx.fillStyle = clock.rung ? '#64748b' : '#f59e0b';
                ctx.fillRect(cx - 16, cy - 16, 32, 32);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(cx - 12, cy - 12, 24, 24);
                
                ctx.fillStyle = '#0f172a';
                ctx.font = '10px monospace';
                ctx.textAlign = 'left';
                ctx.fillText(clock.rung ? 'OFF' : 'RNG', cx - 9, cy + 4);
            });

            if (boss) {
                const bx = Math.round(boss.x + Math.sin(gameTime * 0.05) * 22);
                const by = Math.round(boss.y);
                const floatY = Math.round(Math.sin(gameTime * 0.1) * 6);
                
                // Crown
                ctx.fillStyle = '#fbbf24'; // Gold
                ctx.fillRect(bx + 20, by - 20 + floatY, 60, 20);
                ctx.fillRect(bx + 10, by - 30 + floatY, 20, 20);
                ctx.fillRect(bx + 40, by - 35 + floatY, 20, 25);
                ctx.fillRect(bx + 70, by - 30 + floatY, 20, 20);
                // Jewels in crown
                ctx.fillStyle = '#f43f5e'; // Ruby
                ctx.fillRect(bx + 46, by - 25 + floatY, 8, 8);

                // Main body
                ctx.fillStyle = '#2e1065';
                ctx.fillRect(bx, by + floatY, 100, 70);
                
                // Cloak trim
                ctx.fillStyle = '#4c1d95';
                ctx.fillRect(bx - 10, by + 10 + floatY, 10, 50);
                ctx.fillRect(bx + 100, by + 10 + floatY, 10, 50);
                
                // Lower tentacles/wisps
                ctx.fillStyle = '#2e1065';
                const wisp1 = Math.round(Math.sin(gameTime * 0.15) * 8);
                const wisp2 = Math.round(Math.cos(gameTime * 0.15) * 8);
                ctx.fillRect(bx + 10, by + 70 + floatY + wisp1, 20, 16);
                ctx.fillRect(bx + 40, by + 70 + floatY + wisp2, 20, 24);
                ctx.fillRect(bx + 70, by + 70 + floatY - wisp1, 20, 16);

                // Face / Mask
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(bx + 20, by + 15 + floatY, 60, 40);
                
                // Eyes
                const angryX = Math.round(Math.cos(gameTime*0.2)*4);
                ctx.fillStyle = '#f43f5e'; // Red glowing eyes
                ctx.fillRect(bx + 28 + angryX, by + 25 + floatY, 16, 12);
                ctx.fillRect(bx + 56 + angryX, by + 25 + floatY, 16, 12);
                
                // Pupils
                ctx.fillStyle = '#fef08a';
                ctx.fillRect(bx + 32 + angryX, by + 29 + floatY, 6, 6);
                ctx.fillRect(bx + 60 + angryX, by + 29 + floatY, 6, 6);
                
                // Health bar
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(240, 16, 320, 18);
                ctx.fillStyle = '#f43f5e';
                ctx.fillRect(242, 18, Math.max(0, (boss.hp / boss.maxHp) * 316), 14);
            }

            if (goalPost) {
                ctx.fillStyle = goalPost.unlocked ? '#38bdf8' : '#475569';
                ctx.fillRect(Math.round(goalPost.x), Math.round(goalPost.y), Math.round(goalPost.w), Math.round(goalPost.h));
                
                if (goalPost.unlocked) {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(Math.round(goalPost.x + 8), Math.round(goalPost.y + 10), Math.round(goalPost.w - 16), Math.round(goalPost.h - 20));
                    ctx.fillStyle = '#1e293b';
                    ctx.font = 'bold 20px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('IN', Math.round(goalPost.x + goalPost.w/2), Math.round(goalPost.y + 35));
                }
            }

            enemies.forEach(e => {
                if (!e.alive) return;
                const ex = Math.round(e.x);
                const ey = Math.round(e.y);

                if (e.type === 'bat') {
                    const flap = Math.round(Math.sin(gameTime * 0.4) * 6);
                    // Body
                    ctx.fillStyle = '#1e293b';
                    ctx.fillRect(ex + 6, ey + 4, 12, 14);
                    // Ears
                    ctx.fillRect(ex + 6, ey, 4, 4);
                    ctx.fillRect(ex + 14, ey, 4, 4);
                    // Wings
                    ctx.fillStyle = '#0f172a';
                    // Left wing
                    ctx.fillRect(ex - 6, ey + 4 + flap, 12, 6);
                    ctx.fillRect(ex - 10, ey + 2 + flap * 1.5, 4, 4);
                    // Right wing
                    ctx.fillRect(ex + 18, ey + 4 + flap, 12, 6);
                    ctx.fillRect(ex + 30, ey + 2 + flap * 1.5, 4, 4);
                    
                    // Eyes
                    ctx.fillStyle = '#38bdf8';
                    ctx.fillRect(ex + 8, ey + 8, 2, 2);
                    ctx.fillRect(ex + 14, ey + 8, 2, 2);
                    return;
                }

                // Dust Bunny
                const hopY = Math.round(ey + Math.abs(Math.sin(gameTime * 0.14)) * -6);
                ctx.fillStyle = '#94a3b8'; // Dust gray
                // Body
                ctx.fillRect(ex + 2, hopY + 6, 20, 16);
                ctx.fillStyle = '#cbd5e1'; // Light dust
                ctx.fillRect(ex + 4, hopY + 8, 16, 14);
                // Fluff (particles around it)
                ctx.fillStyle = '#e2e8f0';
                ctx.fillRect(ex - 2, hopY + 14, 4, 4);
                ctx.fillRect(ex + 22, hopY + 16, 4, 4);
                ctx.fillRect(ex + 10, hopY + 2, 4, 4);

                // Ears
                const earTilt = Math.round(Math.sin(gameTime * 0.2) * 2);
                ctx.fillStyle = '#94a3b8';
                ctx.fillRect(ex + 4 + earTilt, hopY - 4, 4, 10);
                ctx.fillRect(ex + 16 - earTilt, hopY - 4, 4, 10);
                ctx.fillStyle = '#fbcfe8'; // Pink inside ear
                ctx.fillRect(ex + 5 + earTilt, hopY - 2, 2, 6);
                ctx.fillRect(ex + 17 - earTilt, hopY - 2, 2, 6);
                
                // Eyes (glowing red/pink)
                ctx.fillStyle = '#f43f5e';
                const faceDir = e.vx > 0 ? 1 : -1;
                ctx.fillRect(ex + 12 + faceDir * 6, hopY + 12, 4, 4); // Eye
            });

            hazards.forEach(hz => {
                ctx.fillStyle = '#020617';
                ctx.fillRect(Math.round(hz.x), Math.round(hz.y + hz.h - 4), Math.round(hz.w), 8);
                ctx.fillStyle = '#fb7185';
                const spikeCount = Math.max(3, Math.floor(hz.w / 12));
                const spikeStep = hz.w / spikeCount;
                for (let s = 0; s < spikeCount; s++) {
                    const sx = Math.round(hz.x + s * spikeStep);
                    ctx.fillRect(sx + 2, hz.y + 4, spikeStep - 4, hz.h - 4);
                    ctx.fillRect(sx + 4, hz.y, spikeStep - 8, 4);
                }
            });

            bossProjectiles.forEach(bp => {
                const px = Math.round(bp.x - bp.r);
                const py = Math.round(bp.y - bp.r);
                ctx.fillStyle = '#2e1065';
                ctx.fillRect(px, py, bp.r*2, bp.r*2);
                ctx.fillStyle = '#c084fc';
                ctx.fillRect(px + 2, py + 2, bp.r*2 - 4, bp.r*2 - 4);
                ctx.fillStyle = '#f43f5e';
                ctx.fillRect(px + 4, py + 4, bp.r*2 - 8, bp.r*2 - 8);
            });

            if (player.invincibleTimer % 4 < 2) {
                ctx.save();
                ctx.translate(Math.round(player.x + player.w / 2), Math.round(player.y + player.h / 2));
                
                const sx = player.scaleX;
                const sy = player.scaleY;
                const pw = Math.round(player.w * sx);
                const ph = Math.round(player.h * sy);
                const px = Math.round(-pw / 2);
                const py = Math.round(-ph / 2);

                if (player.isCharging) {
                    const chargeRatio = player.chargeTimer / player.maxChargeTimer;
                    const auraColor = chargeRatio > 0.8 ? '#f43f5e' : chargeRatio > 0.4 ? '#f59e0b' : '#38bdf8';
                    ctx.fillStyle = auraColor;
                    const auraSize = Math.round(24 + Math.sin(gameTime * 0.35) * 4) * 2;
                    ctx.fillRect(-auraSize/2, -auraSize/2, auraSize, auraSize);
                    ctx.clearRect(-auraSize/2 + 4, -auraSize/2 + 4, auraSize - 8, auraSize - 8);
                }

                // White Stickman Head and Legs
                ctx.fillStyle = '#ffffff';
                // Head
                ctx.fillRect(-6, py + 2, 12, 12);
                
                // Legs
                const walkPhase = player.isGrounded && Math.abs(player.vx) > 0.1 ? Math.sin(gameTime * 0.3) * 6 : 0;
                // Leg 1
                ctx.fillRect(-3 + Math.round(walkPhase), py + 26, 3, 8);
                // Leg 2
                ctx.fillRect(1 - Math.round(walkPhase), py + 26, 3, 8);
                
                // Robe (Bright celestial cyan gradient to stand out)
                if (player.isGliding) {
                    // Puffed up robe (Silksong style)
                    ctx.fillStyle = '#0d9488'; // Teal
                    ctx.fillRect(-12, py + 12, 24, 6);
                    ctx.fillStyle = '#06b6d4'; // Cyan
                    ctx.fillRect(-16, py + 18, 32, 10);
                    ctx.fillStyle = '#38bdf8'; // Sky Blue
                    ctx.fillRect(-20, py + 28, 40, 6);
                    ctx.fillRect(-16, py + 34, 10, 4);
                    ctx.fillRect(6, py + 34, 10, 4);
                } else {
                    // Normal robe
                    const flap = player.isGrounded && Math.abs(player.vx) > 0.1 ? Math.round(Math.sin(gameTime * 0.4) * 3) : 0;
                    ctx.fillStyle = '#0d9488';
                    ctx.fillRect(-8, py + 12, 16, 6);
                    ctx.fillStyle = '#06b6d4';
                    ctx.fillRect(-10 - flap, py + 18, 20, 8);
                    ctx.fillStyle = '#38bdf8';
                    ctx.fillRect(-12 - flap, py + 26, 24, 8);
                }

                // Arms (drawn over robe)
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(-player.facing * 6, py + 18, 6, 4);
                ctx.fillRect(player.facing * 2, py + 18, 6, 4);

                // Stars on robe (White & Yellow)
                if (player.isGliding) {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(-10, py + 16, 4, 4);
                    ctx.fillRect(12, py + 28, 4, 4);
                    ctx.fillStyle = '#fde047';
                    ctx.fillRect(8, py + 20, 4, 4);
                    ctx.fillRect(-6, py + 26, 4, 4);
                    ctx.fillRect(-14, py + 30, 4, 4);
                } else {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(-6, py + 16, 4, 4);
                    ctx.fillRect(-4, py + 28, 4, 4);
                    ctx.fillStyle = '#fde047';
                    ctx.fillRect(4, py + 20, 4, 4);
                }

                // Eyes
                const eyeOffX = player.facing > 0 ? -1 : -5;
                ctx.fillStyle = '#000000';
                if (player.isCharging) {
                    ctx.fillRect(eyeOffX, py + 6, 2, 2);
                    ctx.fillRect(eyeOffX + 4, py + 6, 2, 2);
                    // Angry eyebrows
                    ctx.fillStyle = '#ef4444'; // red
                    ctx.fillRect(eyeOffX - 1, py + 4, 4, 2);
                    ctx.fillRect(eyeOffX + 3, py + 4, 4, 2);
                } else {
                    ctx.fillRect(eyeOffX, py + 6, 2, 4);
                    ctx.fillRect(eyeOffX + 4, py + 6, 2, 4);
                }

                // Cap (Matches top of robe)
                const capTipX = Math.round(-player.facing * (8 + Math.abs(player.vx) * 2));
                const capTipY = Math.round(py - 8 + Math.sin(gameTime * 0.15) * 4);
                
                ctx.fillStyle = '#0d9488';
                ctx.fillRect(-6, py - 4, 12, 6); // Cap base
                ctx.fillRect(-4 + capTipX/2, py - 6, 8, 6); // Mid section
                ctx.fillRect(-3 + capTipX, capTipY, 6, 6); // Tip section

                // Pompom
                ctx.fillStyle = '#fef08a'; // bright yellow
                ctx.fillRect(capTipX - 4, capTipY - 4, 8, 8);

                ctx.restore();
            }

            shockwaves.forEach(sw => {
                ctx.fillStyle = sw.color;
                ctx.globalAlpha = sw.alpha;
                const r = Math.round(sw.radius);
                ctx.fillRect(Math.round(sw.x) - r, Math.round(sw.y) - r, r*2, r*2);
                ctx.clearRect(Math.round(sw.x) - r + 4, Math.round(sw.y) - r + 4, r*2 - 8, r*2 - 8);
                ctx.globalAlpha = 1.0;
            });

            particles.forEach(p => {
                ctx.fillStyle = p.color;
                if (p.maxLife) ctx.globalAlpha = p.life / p.maxLife;
                const s = Math.round(p.size || 6);
                ctx.fillRect(Math.round(p.x - s/2), Math.round(p.y - s/2), s, s);
                ctx.globalAlpha = 1.0;
            });

            zzzParticles.forEach(z => {
                ctx.fillStyle = '#e0f2fe';
                ctx.font = 'bold 24px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('Z', Math.round(z.x), Math.round(z.y));
            });

            floatingTexts.forEach(ft => {
                ctx.fillStyle = ft.color;
                ctx.font = 'bold 20px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, Math.round(ft.x), Math.round(ft.y));
            });

            if (player.isCharging || player.sneezeEnergy < player.maxSneezeEnergy) {
                const barW = 38;
                const barH = 6;
                const bx = Math.round(player.x + player.w / 2 - barW / 2);
                const by = Math.round(player.y - 20);
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(bx, by, barW, barH);
                if (player.isCharging) {
                    const chargeRatio = player.chargeTimer / player.maxChargeTimer;
                    ctx.fillStyle = chargeRatio > 0.8 ? '#f43f5e' : '#f59e0b';
                    ctx.fillRect(bx, by, Math.round(barW * chargeRatio), barH);
                } else {
                    const energyRatio = player.sneezeEnergy / player.maxSneezeEnergy;
                    ctx.fillStyle = '#38bdf8';
                    ctx.fillRect(bx, by, Math.round(barW * energyRatio), barH);
                }
            }

            ctx.fillStyle = '#ffffff';
            ctx.font = '16px monospace';
            ctx.textAlign = 'left';
            const lvl = levels[currentLevelIndex];
            ctx.fillText(`Chap ${currentLevelIndex + 1}: ${lvl.title}`, 20, 30);
            ctx.fillStyle = '#f43f5e';
            ctx.fillText(`LIVES: ${player.health}`, 20, 60);
            ctx.fillStyle = '#38bdf8';
            ctx.fillText(`PILLOWS: ${player.pillowsCollected}/${lvl.pillowsTotal}`, 180, 60);
            ctx.fillStyle = '#f59e0b';
            ctx.fillText(`SCORE: ${player.score}`, 380, 60);
            if (sound.muted) {
                ctx.fillStyle = '#94a3b8';
                ctx.fillText(`MUTED (Press M)`, CANVAS_WIDTH - 200, 30);
            }

            if (currentGameState === STATE.MODAL) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                ctx.fillStyle = '#38bdf8';
                ctx.font = 'bold 48px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(modalData.title, CANVAS_WIDTH/2, CANVAS_HEIGHT/2 - 40);
                
                ctx.fillStyle = '#f1f5f9';
                ctx.font = '24px monospace';
                wrapText(ctx, modalData.story, CANVAS_WIDTH/2, CANVAS_HEIGHT/2 + 20, 600, 32);
                
                if (Math.floor(gameTime / 30) % 2 === 0) {
                    ctx.fillStyle = '#f43f5e';
                    ctx.font = 'bold 32px monospace';
                    ctx.fillText('PRESS SNEEZE TO CONTINUE', CANVAS_WIDTH/2, CANVAS_HEIGHT/2 + 150);
                }
            }

            ctx.restore();
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
